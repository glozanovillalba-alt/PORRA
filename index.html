<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PORRA</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  padding: 15px;
}
.container {
  max-width: 650px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
}
h1 { text-align:center; }
.resumen {
  text-align:center;
  font-size:18px;
  margin-bottom:20px;
}
input {
  width:100%;
  padding:12px;
  font-size:16px;
  box-sizing:border-box;
  margin-bottom:10px;
}
button {
  width:100%;
  padding:12px;
  font-size:16px;
  background:#222;
  color:white;
  border:0;
  border-radius:8px;
  margin-bottom:15px;
}
.participante {
  padding:11px;
  border-bottom:1px solid #ddd;
}
.numero {
  display:inline-block;
  width:35px;
  color:#777;
}
.nombre {
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🏆 PORRA</h1>

<div class="resumen">
Participantes: <strong id="total"></strong><br>
Total recaudado: <strong id="recaudado"></strong>
</div>

<input id="nuevoNombre"
       placeholder="Nombre del nuevo participante">

<button onclick="anadirParticipante()">
Añadir participante
</button>

<div id="lista"></div>

</div>

<script>

const listaCorrecta =  [
"Andrés Ruiz",
"Andrés Vallejo",
"Antonio Casero",
"Antonio Cecilia",
"Antonio Machuca",
"Benji Caravallo",
"Chuli",
"Cristóbal García",
"Diego Lozano",
"Dani Argentino",
"Eloy Sánchez",
"Fernando Domínguez Estebella",
"Gustavo",
"Hans",
"Javi Osorio",
"Jesús Leal",
"José González",
"José Pulido",
"Joselu",
"Juanele",
"Manolo Manzano",
"Máximo",
"Miguel Toro",
"Ortega",
"José Nuño",
"Alfonso Sempere",
"Pedro Díaz",
"Pepe Manzano",
"Perea",
"Javier Sánchez Cuevas",
"Viru",
"Giuseppe",
"Juan Antonio Cuevas",
"Miguel Meneses Ibáñez",
"Juan Antonio",
"Paco Machuca",
"Emilio Rioja",
"Félix Gómez",
"Pepe Guerra",
"Juan Díez"
];

/*
Esta versión cambia la clave de almacenamiento.
Así NO recuperará la lista incorrecta anterior.
*/
const CLAVE = "participantesPorraCorrectosV2";

let participantes =
JSON.parse(localStorage.getItem(CLAVE));

if (!participantes) {
  participantes = listaCorrecta.map(nombre => ({
    nombre: nombre
  }));
  guardar();
}

function guardar() {
  localStorage.setItem(
    CLAVE,
    JSON.stringify(participantes)
  );
}

function ordenar() {
  participantes.sort((a,b) =>
    a.nombre.localeCompare(
      b.nombre,
      "es",
      {sensitivity:"base"}
    )
  );
}

function mostrar() {

  ordenar();

  const lista =
    document.getElementById("lista");

  lista.innerHTML = "";

  participantes.forEach((p,index) => {

    const div =
      document.createElement("div");

    div.className = "participante";

    div.innerHTML =
      '<span class="numero">' +
      (index + 1) +
      '.</span>' +
      '<span class="nombre">' +
      p.nombre +
      '</span>';

    lista.appendChild(div);
  });

  document.getElementById("total").textContent =
    participantes.length;

  document.getElementById("recaudado").textContent =
    (participantes.length * 50) + " €";

  guardar();
}

function anadirParticipante() {

  const input =
    document.getElementById("nuevoNombre");

  const nombre =
    input.value.trim();

  if (!nombre) return;

  const existe =
    participantes.some(p =>
      p.nombre.localeCompare(
        nombre,
        "es",
        {sensitivity:"base"}
      ) === 0
    );

  if (existe) {
    alert("Ese participante ya existe");
    return;
  }

  participantes.push({
    nombre:nombre
  });

  input.value = "";

  guardar();
  mostrar();
}

mostrar();

</script>

</body>
</html>
