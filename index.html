<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PORRA</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:20px;
}

h1 {
  text-align:center;
  color:#222;
}

.container {
  max-width:600px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 2px 10px #ccc;
}

.info {
  background:#eee;
  padding:10px;
  border-radius:10px;
  margin-bottom:15px;
}

table {
  width:100%;
  border-collapse:collapse;
}

th {
  background:#222;
  color:white;
  padding:10px;
}

td {
  border-bottom:1px solid #ddd;
  padding:10px;
  text-align:center;
}

button {
  background:#222;
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:8px;
}

.pagado {
  background:#d9ffd9;
}

.fecha {
  font-size:12px;
  color:#555;
}
</style>

</head>

<body>

<div class="container">

<h1>🏆 PORRA</h1>

<div class="info">
<strong>Importe:</strong> 50 € por persona
<br>
<strong>Total recaudado:</strong> <span id="total">0</span> €
</div>

<table>
<thead>
<tr>
<th>Nº</th>
<th>Participante</th>
<th>Pago</th>
</tr>
</thead>

<tbody id="lista"></tbody>
</table>

<br>

<button onclick="añadir()">➕ Añadir participante</button>

</div>

<script>

let participantes = [
"Alejandro",
"Antonio",
"Carlos",
"Cristina",
"David",
"Diego",
"Eduardo",
"Fernando",
"Francisco",
"Gabriel",
"Gemma",
"Gonzalo",
"Guillermo",
"Javier",
"Jesús",
"Jorge",
"José",
"Juan",
"Luis",
"Manuel",
"María",
"Marta",
"Miguel",
"Nacho",
"Óscar",
"Pablo",
"Patricia",
"Pedro",
"Rafael",
"Raúl",
"Ricardo",
"Roberto",
"Samuel",
"Sandra",
"Sergio",
"Silvia",
"Susana",
"Tomás",
"Víctor",
"Álvaro"
];

function cargar(){

let lista=document.getElementById("lista");
lista.innerHTML="";

let total=0;

participantes.forEach((nombre,index)=>{

let pagado=localStorage.getItem("pago_"+nombre);

if(pagado) total++;

lista.innerHTML += `
<tr class="${pagado?'pagado':''}">
<td>${index+1}</td>
<td>${nombre}</td>
<td>
<input type="checkbox" 
${pagado?'checked':''}
onclick="pagar('${nombre}')">
${pagado?'<div class="fecha">'+pagado+'</div>':''}
</td>
</tr>
`;

});

document.getElementById("total").innerHTML=total*50;

}


function pagar(nombre){

let check=localStorage.getItem("pago_"+nombre);

if(check){

localStorage.removeItem("pago_"+nombre);

}else{

let fecha=new Date().toLocaleString();

localStorage.setItem("pago_"+nombre,fecha);

}

cargar();

}


function añadir(){

let nuevo=prompt("Nombre del participante:");

if(nuevo){

participantes.push(nuevo);

participantes.sort();

cargar();

}

}


cargar();

</script>

</body>
</html>
