<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PORRA</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--green:#16803c;--red:#b42318;--blue:#1d4ed8}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
main{max-width:760px;margin:auto;padding:20px 14px 50px}h1{text-align:center;margin:8px 0 4px;font-size:32px}.sub{text-align:center;color:var(--muted);margin-bottom:18px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.box{background:var(--card);border-radius:14px;padding:12px;text-align:center;box-shadow:0 1px 5px #0001}.box b{display:block;font-size:20px}.box span{font-size:12px;color:var(--muted)}
.controls{display:flex;gap:8px;margin-bottom:12px}.controls input{flex:1;border:1px solid #d1d5db;border-radius:12px;padding:13px;font-size:16px}.controls button,.add button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;background:var(--blue);color:#fff}
.add{display:flex;gap:8px;margin-bottom:14px}.add input{flex:1;border:1px solid #d1d5db;border-radius:12px;padding:13px;font-size:16px}
.person{background:var(--card);border-radius:14px;padding:13px;margin:8px 0;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;box-shadow:0 1px 5px #0001}.name{font-weight:700;font-size:17px}.date{font-size:12px;color:var(--muted);margin-top:4px}.pay{border:0;border-radius:11px;padding:11px 13px;font-weight:700;background:var(--green);color:white;min-width:92px}.paid{background:#e8f5ec}.paid .pay{background:var(--red)}.empty{text-align:center;color:var(--muted);padding:25px}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
</style>
</head>
<body><main>
<h1>PORRA</h1><div class="sub">Control de pagos · 50 € por persona</div>
<div class="summary">
 <div class="box"><b id="people">0</b><span>Participantes</span></div>
 <div class="box"><b id="paid">0</b><span>Pagados</span></div>
 <div class="box"><b id="total">0 €</b><span>Recaudado</span></div>
</div>
<div class="controls"><input id="search" placeholder="Buscar pagador…" oninput="render()"></div>
<div class="add"><input id="newName" placeholder="Nombre del nuevo pagador"><button onclick="addPerson()">Añadir</button></div>
<div id="list"></div>
<div class="note">Los datos quedan guardados en este dispositivo.</div>
</main>
<script>
const KEY='porra-pagos-v1';
let data=JSON.parse(localStorage.getItem(KEY)||'[]');
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function addPerson(){
 const i=document.getElementById('newName'), n=i.value.trim();
 if(!n)return;
 data.push({id:Date.now(),name:n,paid:false,date:null}); i.value=''; save();
}
function toggle(id){
 const p=data.find(x=>x.id===id); if(!p)return;
 if(p.paid){if(!confirm('¿Anular el pago de '+p.name+'?'))return;p.paid=false;p.date=null}
 else {p.paid=true;p.date=new Date().toLocaleString('es-ES')}
 save();
}
function render(){
 const q=document.getElementById('search').value.toLowerCase();
 const list=document.getElementById('list'); list.innerHTML='';
 const filtered=data.filter(p=>p.name.toLowerCase().includes(q));
 filtered.forEach(p=>{
  const d=document.createElement('div'); d.className='person '+(p.paid?'paid':'');
  d.innerHTML=`<div><div class="name">${escapeHtml(p.name)}</div><div class="date">${p.paid?'Pagado: '+p.date:'Pendiente · 50 €'}</div></div>
  <button class="pay" onclick="toggle(${p.id})">${p.paid?'Anular':'Pagado'}</button>`;
  list.appendChild(d);
 });
 if(!filtered.length) list.innerHTML='<div class="empty">Añade el primer pagador.</div>';
 const n=data.filter(x=>x.paid).length;
 document.getElementById('people').textContent=data.length;
 document.getElementById('paid').textContent=n;
 document.getElementById('total').textContent=(n*50)+' €';
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
document.getElementById('newName').addEventListener('keydown',e=>{if(e.key==='Enter')addPerson()});
render();
</script></body></html>
